[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-scraper"
version = "0.1.0"
description = "Extract supplied article URLs into auditable text, metadata and Markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "trafilatura>=2.0,<3",
    "httpx>=0.28,<0.29",
    "beautifulsoup4>=4.13,<5",
    "markdownify>=1.2,<2",
    "pysocks>=1.7,<2",
]

[project.optional-dependencies]
browser = ["playwright>=1.58,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
super-scraper = "super_scraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/super_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["browser: requires optional Playwright and installed Chromium"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
